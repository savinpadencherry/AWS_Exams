<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" role="img" aria-labelledby="t d"><title id="t">Amazon Bedrock RAG architecture</title><desc id="d">Ingestion: documents are chunked and embedded into a searchable index. At request time, a question retrieves relevant passages. The question and passages go to a Bedrock foundation model, which generates an answer with sources.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64869b"/></marker></defs><rect width="820" height="570" fill="#f4f8fb"/><g font-family="system-ui, sans-serif"><text x="28" y="35" font-size="14" font-weight="700" fill="#096f68"><tspan x="28" dy="0">INGESTION • Keep the reference material up to date</tspan></text><rect x="28" y="60" width="225" height="115" rx="12" fill="white" stroke="#b7cfda"/><text x="45" y="93" font-size="18" font-weight="700" fill="#096f68"><tspan x="45" dy="0">Documents</tspan></text><text x="45" y="130" font-size="15" font-weight="400" fill="#17344a"><tspan x="45" dy="0">For example, Amazon S3</tspan></text><rect x="296" y="60" width="225" height="115" rx="12" fill="white" stroke="#b7cfda"/><text x="313" y="93" font-size="18" font-weight="700" fill="#096f68"><tspan x="313" dy="0">Chunk + embed</tspan></text><text x="313" y="130" font-size="15" font-weight="400" fill="#17344a"><tspan x="313" dy="0">Knowledge Base ingestion</tspan></text><rect x="564" y="60" width="225" height="115" rx="12" fill="white" stroke="#b7cfda"/><text x="581" y="93" font-size="18" font-weight="700" fill="#096f68"><tspan x="581" dy="0">Searchable index</tspan></text><text x="581" y="130" font-size="15" font-weight="400" fill="#17344a"><tspan x="581" dy="0">Vectors and source</tspan><tspan x="581" dy="21.0">chunks</tspan></text><rect x="28" y="285" width="225" height="115" rx="12" fill="white" stroke="#b7cfda"/><text x="45" y="318" font-size="18" font-weight="700" fill="#096f68"><tspan x="45" dy="0">User question</tspan></text><text x="45" y="355" font-size="15" font-weight="400" fill="#17344a"><tspan x="45" dy="0">Query the knowledge base</tspan></text><rect x="296" y="285" width="225" height="115" rx="12" fill="white" stroke="#b7cfda"/><text x="313" y="318" font-size="18" font-weight="700" fill="#096f68"><tspan x="313" dy="0">Retrieve passages</tspan></text><text x="313" y="355" font-size="15" font-weight="400" fill="#17344a"><tspan x="313" dy="0">Find relevant, allowed</tspan><tspan x="313" dy="21.0">text</tspan></text><rect x="564" y="285" width="225" height="115" rx="12" fill="white" stroke="#b7cfda"/><text x="581" y="318" font-size="18" font-weight="700" fill="#096f68"><tspan x="581" dy="0">Foundation model</tspan></text><text x="581" y="355" font-size="15" font-weight="400" fill="#17344a"><tspan x="581" dy="0">Question + retrieved</tspan><tspan x="581" dy="21.0">context</tspan></text><path d="M255 115H283" fill="none" stroke="#64869b" stroke-width="2.5" marker-end="url(#a)"/><path d="M523 115H553" fill="none" stroke="#64869b" stroke-width="2.5" marker-end="url(#a)"/><path d="M255 343H283" fill="none" stroke="#64869b" stroke-width="2.5" marker-end="url(#a)"/><path d="M523 343H553" fill="none" stroke="#64869b" stroke-width="2.5" marker-end="url(#a)"/><path d="M677 177V221H408V273" fill="none" stroke="#64869b" stroke-width="2.5" marker-end="url(#a)"/><path d="M677 402V447" fill="none" stroke="#64869b" stroke-width="2.5" marker-end="url(#a)"/><text x="28" y="259" font-size="14" font-weight="700" fill="#096f68"><tspan x="28" dy="0">REQUEST TIME • Retrieve first, then generate</tspan></text><rect x="296" y="460" width="493" height="72" rx="12" fill="#e2f1e9"/><text x="315" y="489" font-size="18" font-weight="700" fill="#096f68"><tspan x="315" dy="0">Answer with source references</tspan></text><text x="315" y="515" font-size="14" font-weight="400" fill="#17344a"><tspan x="315" dy="0">Check support. RAG does not guarantee factual accuracy.</tspan></text><text x="28" y="474" font-size="17" font-weight="400" fill="#526c7e"><tspan x="28" dy="0">Model weights stay</tspan><tspan x="28" dy="23.799999999999997">unchanged.</tspan></text></g></svg>