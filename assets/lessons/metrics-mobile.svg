<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 850" role="img" aria-labelledby="title desc"><title id="title">Precision, recall and missed cases</title><desc id="desc">True positive: 8: Fraud correctly caught. False positive: 4: Normal payment wrongly flagged. False negative: 2: Fraud missed by the model. True negative: 86: Normal payment left alone</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64869b"/></marker></defs><rect width="100%" height="100%" fill="#f4f8fb"/><g font-family="system-ui, sans-serif"><rect x="22" y="25" width="336" height="167" rx="13" fill="white" stroke="#c9dae4"/><rect x="22" y="25" width="7" height="167" rx="3" fill="#096f68"/><circle cx="52" cy="57" r="15" fill="#096f68"/><text x="52" y="63" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text><text x="79" y="63" font-size="18" font-weight="700" fill="#096f68"><tspan x="79" dy="0">True positive: 8</tspan></text><text x="46" y="119" font-size="17" font-weight="400" fill="#17344a"><tspan x="46" dy="0">Fraud correctly caught</tspan></text><rect x="22" y="220" width="336" height="167" rx="13" fill="white" stroke="#c9dae4"/><rect x="22" y="220" width="7" height="167" rx="3" fill="#22608b"/><circle cx="52" cy="252" r="15" fill="#22608b"/><text x="52" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text><text x="79" y="258" font-size="18" font-weight="700" fill="#22608b"><tspan x="79" dy="0">False positive: 4</tspan></text><text x="46" y="314" font-size="17" font-weight="400" fill="#17344a"><tspan x="46" dy="0">Normal payment wrongly flagged</tspan></text><rect x="22" y="415" width="336" height="167" rx="13" fill="white" stroke="#c9dae4"/><rect x="22" y="415" width="7" height="167" rx="3" fill="#745294"/><circle cx="52" cy="447" r="15" fill="#745294"/><text x="52" y="453" text-anchor="middle" font-size="16" font-weight="700" fill="white">3</text><text x="79" y="453" font-size="18" font-weight="700" fill="#745294"><tspan x="79" dy="0">False negative: 2</tspan></text><text x="46" y="509" font-size="17" font-weight="400" fill="#17344a"><tspan x="46" dy="0">Fraud missed by the model</tspan></text><rect x="22" y="610" width="336" height="167" rx="13" fill="white" stroke="#c9dae4"/><rect x="22" y="610" width="7" height="167" rx="3" fill="#ad6523"/><circle cx="52" cy="642" r="15" fill="#ad6523"/><text x="52" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="white">4</text><text x="79" y="648" font-size="18" font-weight="700" fill="#ad6523"><tspan x="79" dy="0">True negative: 86</tspan></text><text x="46" y="704" font-size="17" font-weight="400" fill="#17344a"><tspan x="46" dy="0">Normal payment left alone</tspan></text><text x="24" y="826" font-size="12" font-weight="700" fill="#526c7e"><tspan x="24" dy="0">COMPARE THE ROLES</tspan></text></g></svg>