<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 850" role="img" aria-labelledby="title desc"><title id="title">Agents can use tools to do work</title><desc id="desc">User goal: “Where is my order?”. Agent: Choose an allowed tool. Action group / tool: Call Lambda or application API. Result + response: Use returned facts to answer</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64869b"/></marker></defs><rect width="100%" height="100%" fill="#f4f8fb"/><g font-family="system-ui, sans-serif"><path d="M190 196 L190 211" stroke="#64869b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M190 391 L190 406" stroke="#64869b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M190 586 L190 601" stroke="#64869b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="22" y="25" width="336" height="167" rx="13" fill="white" stroke="#c9dae4"/><rect x="22" y="25" width="7" height="167" rx="3" fill="#096f68"/><circle cx="52" cy="57" r="15" fill="#096f68"/><text x="52" y="63" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text><text x="79" y="63" font-size="18" font-weight="700" fill="#096f68"><tspan x="79" dy="0">User goal</tspan></text><text x="46" y="119" font-size="17" font-weight="400" fill="#17344a"><tspan x="46" dy="0">“Where is my order?”</tspan></text><rect x="22" y="220" width="336" height="167" rx="13" fill="white" stroke="#c9dae4"/><rect x="22" y="220" width="7" height="167" rx="3" fill="#22608b"/><circle cx="52" cy="252" r="15" fill="#22608b"/><text x="52" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text><text x="79" y="258" font-size="18" font-weight="700" fill="#22608b"><tspan x="79" dy="0">Agent</tspan></text><text x="46" y="314" font-size="17" font-weight="400" fill="#17344a"><tspan x="46" dy="0">Choose an allowed tool</tspan></text><rect x="22" y="415" width="336" height="167"