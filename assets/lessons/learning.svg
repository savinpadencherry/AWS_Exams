<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" role="img" aria-labelledby="title desc"><title id="title">How a model learns</title><desc id="desc">Known answers: Supervised: learn input → label. No answer labels: Unsupervised: find groups. Actions + rewards: Reinforcement: learn a policy. New input: Inference: use what was learned</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64869b"/></marker></defs><rect width="100%" height="100%" fill="#f4f8fb"/><g font-family="system-ui, sans-serif"><rect x="30" y="28" width="355" height="180" rx="13" fill="white" stroke="#c9dae4"/><rect x="30" y="28" width="7" height="180" rx="3" fill="#096f68"/><circle cx="60" cy="60" r="15" fill="#096f68"/><text x="60" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text><text x="87" y="66" font-size="18" font-weight="700" fill="#096f68"><tspan x="87" dy="0">Known answers</tspan></text><text x="54" y="122" font-size="17" font-weight="400" fill="#17344a"><tspan x="54" dy="0">Supervised: learn input → label</tspan></text><rect x="435" y="28" width="355" height="180" rx="13" fill="white" stroke="#c9dae4"/><rect x="435" y="28" width="7" height="180" rx="3" fill="#22608b"/><circle cx="465" cy="60" r="15" fill="#22608b"/><text x="465" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text><text x="492" y="66" font-size="18" font-weight="700" fill="#22608b"><tspan x="492" dy="0">No answer labels</tspan></text><text x="459" y="122" font-size="17" font-weight="400" fill="#17344a"><tspan x="459" dy="0">Unsupervised: find groups</tspan></text><rect x="30" y="265" width="355" height="180" rx="13" fill="white" stroke="#c9dae4"/><rect x="30" y="265" width="7" height="180" rx="3" fill="#745294"/><circle cx="60" cy="297" r="15" fill="#745294"/><text x="60" y="303" text-anchor="middle" font-size="16" font-weight="700" 